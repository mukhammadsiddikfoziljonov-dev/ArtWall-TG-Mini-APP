services:
  - type: web
    name: artwall-mini-app
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run check
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: PREVIEW_AUTH_ENABLED
        value: "false"
      - key: MAX_ARTISTS
        value: "100"
      - key: MAX_BUYERS
        value: "500"
      - key: MAX_ARTWORKS_PER_ARTIST
        value: "5"
      - key: MAX_IMAGE_BYTES
        value: "5242880"
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false

